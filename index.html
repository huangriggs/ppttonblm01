<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>簡報內容提取工具</title>
    <!-- 核心函式庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8f9fa; }
        
        /* Google 四原色定義 */
        .g-blue { color: #4285F4; }
        .bg-g-blue { background-color: #4285F4; }
        .g-red { color: #EA4335; }
        .bg-g-red { background-color: #EA4335; }
        .g-yellow { color: #FBBC05; }
        .bg-g-yellow { background-color: #FBBC05; }
        .g-green { color: #34A853; }
        .bg-g-green { background-color: #34A853; }

        .slide-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 20px; border: 1px solid #e0e0e0; background: white; }
        .slide-card:hover { box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .drag-handle { cursor: grab; color: #dadce0; padding: 8px; border-radius: 50%; transition: background 0.2s; }
        .drag-handle:hover { background: #f1f3f4; color: #4285F4; }
        
        .table-cell-input { border: 1px solid #dadce0; padding: 10px; font-size: 0.9rem; width: 100%; min-width: 100px; outline: none; transition: all 0.2s; }
        .table-cell-input:focus { background-color: #e8f0fe; border-color: #4285F4; z-index: 10; position: relative; }
        
        .x-btn { 
            background: #202124 !important; 
            color: white;
            z-index: 50 !important; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .x-btn:hover { background: #EA4335 !important; transform: scale(1.1); }
        
        .img-tag {
            background: rgba(255, 255, 255, 0.95);
            color: #3c4043;
            z-index: 40;
            pointer-events: none;
            font-size: 11px;
            font-weight: 900;
            padding: 2px 6px;
            border-bottom-right-radius: 8px;
        }

        .modal-overlay { background: rgba(32, 33, 36, 0.7); backdrop-filter: blur(8px); }
        .json-viewer { font-family: 'Roboto Mono', monospace; background: #202124; color: #8ab4f8; }
        
        /* 工具列核心動畫與縮放 */
        #action-bar {
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom center;
        }
        
        .collapsed-container {
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #action-bar.is-collapsed {
            width: 80px;
            height: 80px;
            border-radius: 40px;
            padding: 0;
            overflow: hidden;
            background: #4285F4;
            color: white;
            box-shadow: 0 12px 24px rgba(66, 133, 244, 0.4);
            border: none;
        }

        .is-collapsed .full-toolbar-content {
            display: none;
        }

        .is-collapsed .collapsed-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            opacity: 1;
        }

        .image-sort-container div { cursor: move; touch-action: none; }
        .sortable-ghost { opacity: 0.3; background: #e8f0fe; border: 2px dashed #4285F4; }
    </style>
</head>
<body class="min-h-screen text-slate-800 pb-56">

    <div class="max-w-6xl mx-auto py-8 px-4 md:py-12 md:px-6">
        <header class="mb-12 text-center md:text-left">
            <h1 class="text-4xl md:text-6xl font-black tracking-tighter mb-4 flex items-center justify-center md:justify-start">
                <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-green">g</span><span class="g-blue">l</span><span class="g-red">e</span>
                <span class="ml-4 text-slate-900 font-bold">簡報重構</span>
            </h1>
            <div class="flex flex-wrap justify-center md:justify-start gap-3">
                <span class="bg-blue-600 text-white text-[11px] font-black px-4 py-1.5 rounded-full shadow-sm uppercase tracking-widest">Extractor Pro</span>
                <span class="bg-white text-slate-500 text-[11px] font-bold px-4 py-1.5 rounded-full border border-slate-200 shadow-sm uppercase tracking-widest">Batch Processor</span>
            </div>
        </header>

        <!-- 上傳區域 -->
        <div id="drop-zone" class="bg-white p-12 md:p-20 rounded-[40px] shadow-sm border border-slate-200 flex flex-col items-center justify-center mb-16 transition-all hover:border-blue-400 group relative overflow-hidden">
            <input type="file" id="ppt-upload" accept=".pptx, .pdf" class="hidden">
            <div class="flex flex-col items-center space-y-8 z-10">
                <div class="p-8 bg-blue-50 rounded-full group-hover:bg-blue-100 transition-colors duration-500">
                    <svg class="w-16 h-16 g-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                </div>
                <div class="text-center">
                    <label for="ppt-upload" class="cursor-pointer bg-g-blue text-white px-12 py-5 rounded-full font-black text-lg hover:shadow-2xl transition-all shadow-xl block active:scale-95">
                        載入簡報檔案
                    </label>
                    <p class="mt-6 text-slate-400 font-medium">支援 PPTX / PDF 自動轉繁體與表格解析</p>
                </div>
            </div>
            <div id="loader" class="hidden mt-10 flex items-center space-x-4 text-blue-600 bg-blue-50 px-10 py-5 rounded-full shadow-inner">
                <svg class="animate-spin h-6 w-6" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span id="loader-text" class="font-black text-base uppercase tracking-tighter">Processing...</span>
            </div>
        </div>

        <!-- 內容容器 -->
        <div id="slides-container" class="space-y-12 mb-32"></div>

        <!-- AI 風格設定 -->
        <div id="ai-settings-divider" class="hidden border-t border-slate-200 pt-20 pb-10">
            <h2 class="text-4xl font-black text-slate-900 tracking-tight text-center md:text-left">
                <span class="g-blue">A</span><span class="g-red">I</span> 視覺風格定義
            </h2>
            <p class="text-slate-500 mt-2 text-center md:text-left font-medium">讓您的簡報擁有人工智慧賦予的靈魂</p>
        </div>

        <div id="ai-settings-section" class="hidden grid grid-cols-1 md:grid-cols-2 gap-10 items-start mb-24">
            <div class="bg-white p-10 rounded-[32px] shadow-sm border border-slate-200 min-h-[450px] flex flex-col">
                <div class="flex justify-between items-center mb-8">
                    <label class="text-xs font-black text-slate-400 uppercase tracking-widest">風格參考來源</label>
                    <input type="file" id="style-image-upload" accept="image/*" class="hidden" onchange="handleStyleImageUpload(this)">
                    <label for="style-image-upload" class="cursor-pointer bg-blue-50 g-blue px-6 py-2.5 rounded-full text-xs font-black hover:bg-blue-100 transition-colors border border-blue-100">選擇圖片</label>
                </div>
                <div id="style-image-preview" class="flex-grow flex items-center justify-center bg-slate-50 rounded-[24px] border-2 border-dashed border-slate-200 overflow-hidden relative">
                    <span class="text-slate-300 font-medium italic">尚未載入風格範本</span>
                </div>
            </div>

            <div class="bg-white p-10 rounded-[32px] shadow-sm border border-slate-200 min-h-[450px] flex flex-col">
                <div class="flex justify-between items-center mb-8">
                    <label class="text-xs font-black text-slate-400 uppercase tracking-widest">視覺基因特徵 (JSON)</label>
                    <div id="ai-status" class="hidden flex items-center space-x-2"><div class="w-2.5 h-2.5 bg-g-red rounded-full animate-pulse"></div></div>
                </div>
                <div class="flex-grow">
                    <pre id="json-result" class="json-viewer w-full h-full rounded-2xl p-6 text-xs leading-relaxed overflow-y-auto max-h-[350px] whitespace-pre-wrap shadow-inner border border-slate-800">// 待分析視覺數據...</pre>
                </div>
            </div>
        </div>

        <!-- 全能智慧工具列 (可收合) -->
        <div id="action-bar" class="hidden fixed bottom-10 left-1/2 -translate-x-1/2 z-50 flex flex-col lg:flex-row items-center bg-white border border-slate-200 shadow-2xl gap-4 max-w-[98%] w-auto px-8 py-5 rounded-full">
            
            <!-- 展開狀態的完整內容 -->
            <div class="full-toolbar-content flex flex-col lg:flex-row items-center gap-4 w-full">
                <div class="flex items-center space-x-4 border-r border-slate-200 pr-4">
                    <span id="slide-count" class="bg-g-blue text-white w-10 h-10 flex items-center justify-center rounded-full text-sm font-black shadow-lg">0</span>
                    <span class="text-xs font-black text-slate-500 uppercase tracking-tighter">已提取區塊</span>
                </div>
                
                <div class="flex flex-wrap justify-center gap-3">
                    <button onclick="exportImages()" class="bg-g-blue text-white px-6 py-3 rounded-full font-black hover:brightness-110 transition-all text-xs shadow-md">圖片ZIP</button>
                    <button onclick="exportData()" class="bg-g-green text-white px-6 py-3 rounded-full font-black hover:brightness-110 transition-all text-xs shadow-md">來源文字</button>
                    <button onclick="exportAIStyle()" class="bg-g-yellow text-slate-800 px-6 py-3 rounded-full font-black hover:brightness-110 transition-all text-xs shadow-md">風格JSON</button>

                    <div class="w-px h-8 bg-slate-100 mx-1 hidden lg:block"></div>

                    <button onclick="exportImagesNBLM()" class="bg-slate-900 text-white px-6 py-3 rounded-full font-black hover:bg-black transition-all text-xs flex items-center gap-2">
                        <span class="w-2 h-2 bg-g-blue rounded-full"></span>圖片ZIP_NBLM
                    </button>
                    <button onclick="exportDataNBLM()" class="bg-slate-900 text-white px-6 py-3 rounded-full font-black hover:bg-black transition-all text-xs flex items-center gap-2">
                        <span class="w-2 h-2 bg-g-green rounded-full"></span>來源文字_NBLM
                    </button>
                    <button onclick="exportAIStyleNBLM()" class="bg-slate-900 text-white px-6 py-3 rounded-full font-black hover:bg-black transition-all text-xs flex items-center gap-2">
                        <span class="w-2 h-2 bg-g-yellow rounded-full"></span>風格JSON_NBLM
                    </button>

                    <button onclick="window.location.reload()" class="bg-slate-100 text-slate-400 px-6 py-3 rounded-full font-bold hover:bg-red-50 hover:text-red-500 transition-all text-xs">清空</button>
                </div>

                <!-- 縮放按鈕 (展開時) -->
                <button onclick="toggleToolbar()" class="bg-slate-50 p-3 rounded-full hover:bg-slate-100 transition-colors border border-slate-200 ml-2" title="縮小工具列">
                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </button>
            </div>

            <!-- 收合狀態的內容 -->
            <div class="collapsed-container" onclick="toggleToolbar()" title="展開工具列">
                <span id="slide-count-min" class="text-xl font-black mb-1">0</span>
                <svg class="w-5 h-5 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7"/></svg>
            </div>
        </div>
    </div>

    <!-- OCR 彈窗 -->
    <div id="ocr-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="modal-overlay absolute inset-0"></div>
        <div class="bg-white rounded-[40px] shadow-2xl relative z-10 w-full max-w-lg p-12 text-center border-t-8 border-g-yellow">
            <h2 class="text-3xl font-black text-slate-900 mb-6 font-serif">影像型 PDF</h2>
            <p class="text-slate-500 mb-10 leading-relaxed font-medium">尊貴的男子漢大人，這份檔案沒有文字層。<br>是否啟動光學字元辨識 (OCR)？</p>
            <div class="grid grid-cols-2 gap-6">
                <button id="btn-run-ocr" class="bg-g-blue text-white font-black py-5 rounded-3xl shadow-xl active:scale-95 transition-all">啟動</button>
                <button id="btn-skip-ocr" class="bg-slate-100 text-slate-500 font-bold py-5 rounded-3xl active:scale-95 transition-all">略過</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-32 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-10 py-5 rounded-full shadow-2xl transform translate-y-48 transition-transform duration-500 font-black z-[100] text-sm tracking-widest"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const s2tConverter = OpenCC.Converter({ from: 'cn', to: 'tw' });
        const apiKey = ""; 

        const uploadInput = document.getElementById('ppt-upload');
        const container = document.getElementById('slides-container');
        const loader = document.getElementById('loader');
        const actionBar = document.getElementById('action-bar');
        const aiDivider = document.getElementById('ai-settings-divider');
        const aiSection = document.getElementById('ai-settings-section');

        let slidesData = []; 
        let currentPdfFile = null;
        let sortableInstance = null;
        let originalFileName = "presentation_assets"; 
        let isToolbarCollapsed = false;

        // 工具列縮放切換
        function toggleToolbar() {
            isToolbarCollapsed = !isToolbarCollapsed;
            if (isToolbarCollapsed) {
                actionBar.classList.add('is-collapsed');
            } else {
                actionBar.classList.remove('is-collapsed');
            }
        }

        uploadInput.addEventListener('change', handleFileUpload);

        async function handleFileUpload() {
            const file = uploadInput.files[0]; if (!file) return;
            originalFileName = file.name.replace(/\.[^/.]+$/, "");
            showLoader(true, "Decoding presentation...");
            try {
                if (file.name.toLowerCase().endsWith('.pptx')) {
                    const zip = await JSZip.loadAsync(file);
                    slidesData = await parsePptx(zip);
                    finishLoading();
                } else if (file.name.toLowerCase().endsWith('.pdf')) {
                    currentPdfFile = file;
                    const result = await parsePdf(file);
                    if (result.every(s => s.isEmpty)) { showLoader(false); document.getElementById('ocr-modal').classList.remove('hidden'); }
                    else { slidesData = result; finishLoading(); }
                }
            } catch (error) { showToast("解析失敗"); showLoader(false); }
        }

        async function parsePptx(zip) {
            const results = [];
            const slideFiles = Object.keys(zip.files).filter(n => n.startsWith('ppt/slides/slide') && n.endsWith('.xml'));
            slideFiles.sort((a, b) => parseInt(a.replace(/[^\d]/g, '') || 0) - parseInt(b.replace(/[^\d]/g, '') || 0));
            for (let i = 0; i < slideFiles.length; i++) {
                const xml = await zip.file(slideFiles[i]).async("string");
                const doc = new DOMParser().parseFromString(xml, "application/xml");
                const tableNodes = doc.getElementsByTagName("a:tbl");
                let slideType = 'text', tableData = [];
                if (tableNodes.length > 0) {
                    slideType = 'table';
                    const rows = tableNodes[0].getElementsByTagName("a:tr");
                    for (let row of Array.from(rows)) {
                        const cells = row.getElementsByTagName("a:tc");
                        tableData.push(Array.from(cells).map(cell => s2tConverter(Array.from(cell.getElementsByTagName("a:t")).map(t => t.textContent).join("").trim())));
                    }
                }
                const texts = Array.from(doc.getElementsByTagName("a:t")).map(n => n.textContent.trim()).filter(Boolean);
                const slideNum = slideFiles[i].replace(/[^\d]/g, '');
                let images = [];
                const relPath = `ppt/slides/_rels/slide${slideNum}.xml.rels`;
                if (zip.file(relPath)) {
                    const relXml = new DOMParser().parseFromString(await zip.file(relPath).async("string"), "application/xml");
                    for (let rel of Array.from(relXml.getElementsByTagName("Relationship"))) {
                        if (rel.getAttribute("Type").endsWith("image")) {
                            const target = rel.getAttribute("Target");
                            const imgPath = `ppt/media/${target.split('/').pop()}`;
                            if (zip.file(imgPath)) { 
                                images.push({ data: `data:image/png;base64,${await zip.file(imgPath).async("base64")}` }); 
                            }
                        }
                    }
                }
                results.push({ title: s2tConverter(texts[0] || `區塊 ${i+1}`), type: slideType, content: s2tConverter(texts.slice(1).join(" ")), tableData, images, isDeleted: false, deletedImages: [] });
            }
            return results;
        }

        async function parsePdf(file, empty = false) {
            const results = [];
            const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
            for (let i = 1; i <= pdf.numPages; i++) {
                if (empty) { results.push({ title: `頁面 ${i}`, type: 'text', content: "", tableData: [], images: [], isDeleted: false, deletedImages: [] }); continue; }
                const page = await pdf.getPage(i);
                const tc = await page.getTextContent();
                const lines = tc.items.map(it => it.str.trim()).filter(Boolean);
                results.push({ title: s2tConverter(lines[0] || `頁面 ${i}`), type: 'text', content: s2tConverter(lines.slice(1).join(" ")), tableData: [], images: [], isDeleted: false, deletedImages: [], isEmpty: lines.length === 0 });
            }
            return results;
        }

        function renderSlides() {
            container.innerHTML = '';
            slidesData.forEach((s, i) => {
                const el = document.createElement('div');
                if (s.isDeleted) {
                    el.className = 'bg-slate-100 border-dashed border-2 p-8 rounded-[24px] flex justify-between items-center opacity-60';
                    el.innerHTML = `<span class="text-slate-400 font-black uppercase text-sm tracking-widest">#${i+1} Block Hidden</span><button onclick="toggleSlide(${i})" class="bg-g-blue text-white px-8 py-2.5 rounded-full text-xs font-black shadow-lg">RESTORE</button>`;
                } else {
                    el.className = 'slide-card p-8 md:p-12 relative mb-12';
                    const isTable = s.type === 'table';
                    el.innerHTML = `
                        <div class="flex justify-between items-center mb-10">
                            <div class="flex items-center space-x-6">
                                <div class="drag-handle">
                                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M11 18c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm-2-8c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 4c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                                </div>
                                <span class="bg-g-blue text-white w-11 h-11 flex items-center justify-center rounded-full text-sm font-black shadow-xl">${i+1}</span>
                                <input type="text" value="${s.title}" onchange="slidesData[${i}].title=this.value" class="text-2xl font-black text-slate-900 bg-transparent border-none focus:ring-0 w-full md:w-[500px]">
                            </div>
                            <div class="flex items-center space-x-3">
                                <button onclick="toggleMode(${i})" class="text-[10px] font-black px-5 py-2 rounded-full border transition-all ${isTable ? 'bg-blue-50 g-blue border-blue-200' : 'bg-slate-50 text-slate-500 border-slate-200'}">${isTable ? 'GRID MODE' : 'TEXT MODE'}</button>
                                <button onclick="toggleSlide(${i})" class="text-slate-300 hover:text-red-500 p-2 transition-transform hover:scale-125"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                            <div class="space-y-6">
                                ${isTable ? renderTableEditor(s, i) : `<textarea onchange="slidesData[${i}].content=this.value" class="w-full bg-slate-50 border-none rounded-[24px] p-8 text-slate-700 text-lg leading-relaxed min-h-[280px] focus:ring-4 focus:ring-blue-50 resize-none shadow-inner">${s.content}</textarea>`}
                            </div>
                            <div class="space-y-6">
                                <div class="flex justify-between items-center px-2">
                                    <label class="text-xs font-black text-slate-400 uppercase tracking-widest">Media Assets (${s.images.length})</label>
                                    <div class="flex items-center gap-4">
                                        ${s.deletedImages && s.deletedImages.length > 0 ? `<button onclick="restoreImage(${i})" class="text-xs font-bold g-blue hover:underline underline-offset-4">Restore (${s.deletedImages.length})</button>` : ''}
                                        <label class="text-xs font-black g-green cursor-pointer hover:underline underline-offset-4">ADD MEDIA<input type="file" multiple accept="image/*" class="hidden" onchange="addImg(${i}, this)"></label>
                                    </div>
                                </div>
                                <div class="image-sort-container flex flex-wrap gap-6 p-8 bg-slate-50 rounded-[24px] min-h-[280px] border border-dashed border-slate-200 shadow-inner overflow-y-auto max-h-[450px]" data-slide-idx="${i}">
                                    ${s.images.map((img, idx) => `<div class="relative group h-32 w-32"><span class="img-tag absolute top-0 left-0 shadow-sm">${i+1}-${idx+1}</span><img src="${img.data}" class="h-full w-full object-contain bg-white rounded-2xl border border-slate-200 shadow-md transition-transform group-hover:scale-95"><button onclick="rmImg(${i}, ${idx})" class="x-btn absolute -top-3 -right-3"><span class="text-[12px] font-black">✕</span></button></div>`).join('') || '<div class="w-full h-full flex items-center justify-center text-slate-300 py-10 font-bold italic">Drag and drop media here</div>'}
                                </div>
                            </div>
                        </div>`;
                }
                container.appendChild(el);
            });
            initSortable();
        }

        function renderTableEditor(slide, slideIdx) {
            let html = `<div class="overflow-x-auto rounded-2xl bg-white shadow-inner p-4 max-h-[350px] border border-slate-100"><table class="w-full border-collapse">`;
            (slide.tableData || []).forEach((row, rIdx) => {
                html += `<tr>`;
                row.forEach((cell, cIdx) => html += `<td class="p-0"><div contenteditable="true" onblur="slidesData[${slideIdx}].tableData[${rIdx}][${cIdx}]=this.innerText" class="table-cell-input">${cell}</div></td>`);
                html += `</tr>`;
            });
            html += `</table></div><div class="flex space-x-4 mt-6 px-2"><button onclick="addRow(${slideIdx})" class="text-xs bg-slate-900 text-white px-6 py-2.5 rounded-full font-black shadow-lg hover:brightness-110 transition-all">＋ ROW</button><button onclick="addCol(${slideIdx})" class="text-xs bg-slate-900 text-white px-6 py-2.5 rounded-full font-black shadow-lg hover:brightness-110 transition-all">＋ COL</button></div>`;
            return html;
        }

        function initSortable() {
            if (sortableInstance) sortableInstance.destroy();
            sortableInstance = new Sortable(container, { animation: 300, handle: '.drag-handle', ghostClass: 'sortable-ghost', onEnd: (e) => {
                const item = slidesData.splice(e.oldIndex, 1)[0]; slidesData.splice(e.newIndex, 0, item); renderSlides();
            } });
            document.querySelectorAll('.image-sort-container').forEach(el => {
                const sIdx = parseInt(el.getAttribute('data-slide-idx'));
                new Sortable(el, { animation: 250, ghostClass: 'sortable-ghost', filter: '.x-btn', onEnd: (e) => {
                    const img = slidesData[sIdx].images.splice(e.oldIndex, 1)[0];
                    slidesData[sIdx].images.splice(e.newIndex, 0, img);
                    renderSlides();
                }});
            });
        }

        async function handleStyleImageUpload(input) {
            const file = input.files[0]; if (!file) return;
            const preview = document.getElementById('style-image-preview');
            const jsonBox = document.getElementById('json-result');
            const aiStatus = document.getElementById('ai-status');
            const reader = new FileReader();
            reader.onload = async (e) => {
                preview.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
                aiStatus.classList.remove('hidden'); jsonBox.textContent = "// Decoding Visual DNA...";
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: "寫下這張圖片的所有視覺特徵（配色、字體感、佈局、氛圍），嚴格以 JSON 格式輸出。" }, { inlineData: { mimeType: file.type, data: e.target.result.split(',')[1] } }]}] })
                    });
                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
                    const jsonMatch = text.match(/\{[\s\S]*\}/);
                    jsonBox.textContent = JSON.stringify(JSON.parse(jsonMatch ? jsonMatch[0] : text), null, 2);
                    showToast("視覺風格解碼完成！");
                } catch (err) { jsonBox.textContent = "// 解析失敗，請檢查連線。"; } finally { aiStatus.classList.add('hidden'); }
            };
            reader.readAsDataURL(file);
        }

        function formatTableAsMarkdown(data) {
            if (!data || data.length === 0) return "";
            const header = "| " + data[0].join(" | ") + " |";
            const separator = "| " + data[0].map(() => "---").join(" | ") + " |";
            const rows = data.slice(1).map(row => "| " + row.join(" | ") + " |").join("\n");
            return `${header}\n${separator}\n${rows}`;
        }

        function exportDataNBLM() {
            const valid = slidesData.filter(s => !s.isDeleted);
            for (let i = 0; i < valid.length; i += 15) {
                const chunk = valid.slice(i, i + 15);
                const batchStr = (Math.floor(i / 15) + 1).toString().padStart(2, '0');
                let txt = `【NotebookLM 來源 - ${originalFileName}-${batchStr}】\n\n`;
                chunk.forEach((s, idx) => {
                    const gIdx = i + idx + 1;
                    txt += `[段落名稱: 區塊 ${gIdx}]\n## ${s.title}\n${s.type === 'table' ? formatTableAsMarkdown(s.tableData) : s.content}\n[素材索引: ${s.images.map((_, ii)=>`${gIdx}-${ii+1}`).join(', ')}]\n\n`;
                });
                downloadFile(`${originalFileName}-${batchStr}.txt`, txt);
            }
            showToast("分批來源文字已導出");
        }

        function exportAIStyleNBLM() {
            const styleJson = document.getElementById('json-result').textContent;
            if (styleJson.startsWith("//") || styleJson === "{}") { showToast("請先分析風格圖"); return; }
            const valid = slidesData.filter(s => !s.isDeleted);
            for (let i = 0; i < valid.length; i += 15) {
                const batchStr = (Math.floor(i / 15) + 1).toString().padStart(2, '0');
                const targetName = `${originalFileName}-${batchStr}`;
                const prompt = `\n\n【生成指令】\n請依據來源「${targetName}」檔案內容，生成一份最多15頁的簡報。每一頁內容必須嚴格依照「${targetName}」內的「段落名稱」順序與規劃對應，不得自行增減主題或更動編排順序。每個段落的內容文字均須完整呈現。簡報的首頁標題由你自由發揮。`;
                downloadFile(`${targetName}_Style_NBLM.txt`, "風格基準特徵 JSON:\n" + styleJson + prompt);
            }
            showToast("分批風格說明檔已導出");
        }

        async function exportImagesNBLM() {
            const valid = slidesData.filter(s => !s.isDeleted);
            showLoader(true, "封裝批次圖片中...");
            for (let i = 0; i < valid.length; i += 15) {
                const chunk = valid.slice(i, i + 15);
                const batchStr = (Math.floor(i / 15) + 1).toString().padStart(2, '0');
                const zip = new JSZip(); let has = false;
                chunk.forEach((s, idx) => {
                    const gIdx = i + idx + 1;
                    s.images.forEach((img, ii) => { has = true; zip.file(`${gIdx}-${ii+1}.png`, img.data.split(',')[1], {base64: true}); });
                });
                if (has) downloadBlob(`${originalFileName}-${batchStr}.zip`, await zip.generateAsync({type: "blob"}));
            }
            showLoader(false); showToast("批次圖片壓縮包已完成");
        }

        function exportData() {
            let txt = `【完整來源文字】\n\n`;
            slidesData.filter(s => !s.isDeleted).forEach((s, i) => txt += `## ${s.title}\n${s.type === 'table' ? formatTableAsMarkdown(s.tableData) : s.content}\n\n`);
            downloadFile(`${originalFileName}_Full.txt`, txt);
        }
        async function exportImages() {
            const zip = new JSZip();
            slidesData.filter(s => !s.isDeleted).forEach((s, si) => s.images.forEach((img, ii) => zip.file(`${si+1}-${ii+1}.png`, img.data.split(',')[1], {base64: true})));
            downloadBlob(`${originalFileName}_Images.zip`, await zip.generateAsync({type: "blob"}));
        }
        function exportAIStyle() { downloadFile(`${originalFileName}_Style.txt`, "AI 風格特徵分析結果：\n\n" + document.getElementById('json-result').textContent); }

        function downloadFile(n, c) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([c], {type: 'text/plain'})); a.download = n; a.click(); }
        function downloadBlob(n, b) { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = n; a.click(); }
        function showLoader(s, t) { loader.classList.toggle('hidden', !s); document.getElementById('loader-text').textContent = t; }
        function showToast(m) { 
            const t = document.getElementById('toast'); t.textContent = m; 
            t.classList.remove('translate-y-48'); setTimeout(() => t.classList.add('translate-y-48'), 3000); 
        }
        function finishLoading() { 
            renderSlides(); 
            document.getElementById('slide-count').textContent = slidesData.length;
            document.getElementById('slide-count-min').textContent = slidesData.length;
            actionBar.classList.remove('hidden'); aiDivider.classList.remove('hidden'); aiSection.classList.remove('hidden'); showLoader(false); 
        }
        function toggleSlide(i) { slidesData[i].isDeleted = !slidesData[i].isDeleted; renderSlides(); }
        function rmImg(si, ii) { 
            const rem = slidesData[si].images.splice(ii, 1)[0]; 
            if(!slidesData[si].deletedImages) slidesData[si].deletedImages = []; 
            slidesData[si].deletedImages.push(rem); renderSlides(); 
        }
        function restoreImage(si) { if(slidesData[si].deletedImages?.length) { slidesData[si].images.push(slidesData[si].deletedImages.pop()); renderSlides(); } }
        async function addImg(i, input) { for (let f of input.files) { const rd = new FileReader(); rd.onload = (e) => { slidesData[i].images.push({data: e.target.result}); renderSlides(); }; rd.readAsDataURL(f); } }
        function toggleMode(i) { slidesData[i].type = (slidesData[i].type === 'table' ? 'text' : 'table'); if(slidesData[i].type==='table' && (!slidesData[i].tableData || !slidesData[i].tableData.length)) slidesData[i].tableData=[["項目","內容"]]; renderSlides(); }
        function addRow(sIdx) { slidesData[sIdx].tableData.push(new Array((slidesData[sIdx].tableData[0] || []).length || 1).fill("")); renderSlides(); }
        function addCol(sIdx) { slidesData[sIdx].tableData.forEach(row => row.push("")); renderSlides(); }

        document.getElementById('btn-run-ocr').addEventListener('click', async () => {
            document.getElementById('ocr-modal').classList.add('hidden');
            showLoader(true, "OCR 文字辨識中...");
            const pdf = await pdfjsLib.getDocument({ data: await currentPdfFile.arrayBuffer() }).promise;
            const worker = await Tesseract.createWorker('chi_tra+chi_sim+eng');
            const res = [];
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const vp = page.getViewport({ scale: 2.5 });
                const cvs = document.createElement('canvas'); cvs.height = vp.height; cvs.width = vp.width;
                await page.render({ canvasContext: cvs.getContext('2d'), viewport: vp }).promise;
                const { data: { text } } = await worker.recognize(cvs.toDataURL());
                res.push({ title: text.slice(0, 15), type: 'text', content: s2tConverter(text.replace(/\n/g, ' ')), tableData: [], images: [], isDeleted: false, deletedImages: [] });
            }
            await worker.terminate(); slidesData = res; finishLoading();
        });
        document.getElementById('btn-skip-ocr').addEventListener('click', () => { document.getElementById('ocr-modal').classList.add('hidden'); parsePdf(currentPdfFile, true).then(r => { slidesData = r; finishLoading(); }); });
    </script>
</body>
</html>
